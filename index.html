<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animated Birthday Cake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="balloons" id="balloons"></div>
<canvas id="cv"></canvas>
<div class="stage">
  <div class="cake" id="cake">
    <div class="candles">
      <div class="candle"><div class="flame"></div><i class="smoke"></i></div>
      <div class="candle"><div class="flame"></div><i class="smoke"></i></div>
      <div class="candle"><div class="flame"></div><i class="smoke"></i></div>
    </div>
    <div class="layer top"><span class="cherry"></span></div>
    <div class="layer mid"></div>
    <div class="layer bot"></div>
    <div class="plate"></div>
  </div>
  <div class="msg"><div class="hb" id="hb"></div><div class="nm" id="nm"></div></div>
</div>
<div class="ui">
  <button id="blow">🕯️ Tiup lilin</button>
  <button id="relight">🔥 Nyalakan lagi</button>
  <button id="party">🎉 Confetti</button>
</div>
<script src="script.js"></script>
</body>
</html>
